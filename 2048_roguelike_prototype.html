<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048 Roguelike Prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171717;color:#f5f5f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100vh}
.wrap{width:min(96vw,520px);padding:18px 12px 28px;position:relative;z-index:1}
/* background ellipse */
.bg-ellipse{position:fixed;left:50%;top:28%;transform:translateX(-50%);width:1200px;height:420px;background:radial-gradient(ellipse at center, rgba(200,160,50,0.06) 0%, rgba(120,100,40,0.02) 40%, transparent 60%);border-radius:50%;pointer-events:none;z-index:0}

h1{font-size:28px;margin:4px 0 14px;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.card{background:#252525;border-radius:12px;padding:9px;text-align:center}
.label{font-size:11px;color:#aaa}.value{font-size:20px;font-weight:800}
.enemy{background:#252525;border-radius:14px;padding:12px;margin-bottom:10px;text-align:center}
.enemyTop{display:flex;justify-content:space-between;font-weight:700}
.enemy img{display:block;margin:10px auto 6px;width:72px;height:72px;object-fit:contain;border-radius:8px}
.hpbar{height:20px;background:#444;border-radius:99px;overflow:hidden;margin-top:8px;position:relative}
.hp{height:100%;background:linear-gradient(90deg,#ff8a65,#ff5722);width:100%;transition:width .3s}
.hpText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:white;text-shadow:0 1px 0 #0008;font-size:12px}
.playerHpContainer{margin-top:8px}
.playerHpBar{height:10px;background:#334433;border-radius:99px;overflow:hidden;position:relative;margin-top:6px}
.playerHpFill{height:100%;background:linear-gradient(90deg,#8ce68c,#2ec02e);width:100%;transition:width .3s}
.playerHpText{font-size:11px;color:#a9f0a9;margin-top:6px}
.board{background:#8d8274;padding:8px;border-radius:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none}
.tile{aspect-ratio:1;border-radius:9px;background:#b9b0a5;display:flex;align-items:center;justify-content:center;font-size:clamp(25px,8vw,43px);font-weight:900;color:#333}
.t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:white}.t16{background:#f59563;color:white}.t32{background:#f67c5f;color:white}.t64{background:#f65e3b;color:white}.t128{background:#edcf72;color:white}.t256{background:#edcc61;color:white}.t512{background:#edc850;color:white}.t1024{background:#edc53f;color:white}.t2048{background:#edc22e;color:white}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px auto 8px;max-width:300px}
button{border:0;border-radius:11px;padding:12px;background:#333;color:white;font-size:18px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dir{height:58px;font-size:24px;touch-action:manipulation}
.restart{display:block;margin:0 auto 10px;background:#292929;color:#bbb;font-size:13px;padding:9px 14px}
button:active{transform:scale(.97);background:#444}
.help{text-align:center;color:#aaa;font-size:12px;margin:8px 0}
.log{background:#202020;border-radius:12px;padding:10px;min-height:42px;font-size:13px;line-height:1.45}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{width:min(94vw,480px);background:#252525;border-radius:18px;padding:20px;text-align:center}
.modal h2{margin:0 0 8px}
.choices{display:grid;gap:9px;margin-top:14px}
.choice{text-align:left;background:#333;padding:12px;border-radius:12px;cursor:pointer}
.choice b{display:block;margin-bottom:3px}.choice small{color:#bbb}
.primary{background:#e0a23b;color:#171717;margin-top:12px;width:100%}
.hidden{display:none!important}

/* Damage popup */
.damagePopup{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:52px;font-weight:900;padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;z-index:120;transition:transform .35s,opacity .35s}
.damagePopup.show{opacity:1;transform:translate(-50%,-120%)}
.damagePopup.enemy{color:#ffd966;text-shadow:0 2px 6px #0008}
.damagePopup.player{color:#ff6b6b;text-shadow:0 2px 6px #0008}

/* screen shake */
@keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:translateX(0)}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}

</style>
</head>
<body>
<div class="bg-ellipse" aria-hidden="true"></div>
<div class="wrap" id="wrap">
<h1>2048 ROGUELIKE</h1>
<div class="stats">
  <div class="card"><div class="label">PLAYER HP</div><div class="value" id="playerHp">30</div>
    <div class="playerHpContainer">
      <div class="playerHpBar"><div class="playerHpFill" id="playerHpFill"></div></div>
      <div class="playerHpText" id="playerHpText">30 / 30</div>
    </div>
  </div>
  <div class="card"><div class="label">FLOOR</div><div class="value" id="floor">1</div></div>
  <div class="card"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
</div>

<div class="enemy">
  <div class="enemyTop"><span id="enemyName">スライム</span><span id="enemyHpText">20 / 20</span></div>
  <img id="enemyImg" alt="enemy">
  <div class="hpbar"><div class="hp" id="enemyHp"></div><div class="hpText" id="enemyHpText2">20 / 20</div></div>
</div>

<div class="board" id="board"></div>

<div class="controls">
  <div></div><button class="dir" data-dir="up">▲</button><div></div>
  <button class="dir" data-dir="left">◀</button><button class="dir" data-dir="down">▼</button><button class="dir" data-dir="right">▶</button>
</div>
<button class="restart" onclick="resetGame()">↻ 最初からやり直す</button>
<div class="help">スマホ: 下の矢印ボタン or スワイプ　・　PC: 矢印キー / WASD</div>
<div class="log" id="log">タイルを動かして合体させよう❤</div>
</div>

<div class="overlay" id="startOverlay" style="display:flex;z-index:60">
 <div class="modal">
  <h2>2048 ROGUELIKE</h2>
  <div>数字を合体させて敵を倒そう！❤</div>
  <button class="primary" id="startButton">ゲーム開始</button>
 </div>
</div>

<div class="overlay" id="upgradeOverlay">
 <div class="modal">
  <h2>LEVEL UP!</h2>
  <div>能力を1つ選んでね</div>
  <div class="choices" id="choices"></div>
 </div>
</div>

<div class="overlay" id="gameOverOverlay">
 <div class="modal">
  <h2>GAME OVER</h2>
  <div id="finalScore"></div>
  <button class="primary" onclick="resetGame()">もう一度遊ぶ</button>
 </div>
</div>

<script>
const SIZE=4;
let board=[], maxPlayerHp=30, playerHp=30, floor=1, score=0, enemy=null;
let bonusDamage=0, shield=0, heal=0, comboBonus=0;
let baseAttack=0; // 基礎攻撃力
let canMove=false, touchStart=null;
let pendingTimeout=null;

const enemyTypes=[
 {name:"スライム",hp:20,atk:3},
 {name:"ゴブリン",hp:28,atk:5},
 {name:"ゴーレム",hp:45,atk:4},
 {name:"魔法使い",hp:35,atk:7}
];

function emptyBoard(){return Array(SIZE*SIZE).fill(0)}
function addRandom(){
 const empties=board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
 if(!empties.length)return;
 const i=empties[Math.floor(Math.random()*empties.length)];
 board[i]=Math.random()<.9?2:4;
}
function enemyImageDataURL(name){
 const label=name.charAt(0);
 const color="#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><rect width='100%' height='100%' rx='20' fill='${color}'/><text x='50%' y='54%' font-size='120' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='#fff'>${label}</text></svg>`;
 return 'data:image/svg+xml;base64,'+btoa(svg);
}

function spawnEnemy(){
 const t=enemyTypes[Math.min(enemyTypes.length-1,Math.floor((floor-1)/2))];
 const scale=1+(floor-1)*.22;
 enemy={name:t.name,hp:Math.round(t.hp*scale),maxHp:Math.round(t.hp*scale),atk:Math.round(t.atk*scale)};
 const img=document.getElementById('enemyImg'); img.src=enemyImageDataURL(enemy.name); img.alt=enemy.name;
}

function render(){
 const el=document.getElementById("board"); el.innerHTML="";
 board.forEach(v=>{
   const d=document.createElement("div"); d.className="tile "+(v?"t"+v:"");
   d.textContent=v||""; el.appendChild(d);
 });
 document.getElementById("playerHp").textContent=playerHp;
 document.getElementById("floor").textContent=floor;
 document.getElementById("score").textContent=score;
 if(enemy){
   document.getElementById("enemyName").textContent=enemy.name;
   document.getElementById("enemyHpText").textContent=`${Math.max(0,enemy.hp)} / ${enemy.maxHp}`;
   document.getElementById("enemyHpText2").textContent=`${Math.max(0,enemy.hp)} / ${enemy.maxHp}`;
   document.getElementById("enemyHp").style.width=Math.max(0,enemy.hp/enemy.maxHp*100)+"%";
 }
 // player hp bar
 document.getElementById('playerHpFill').style.width=Math.max(0,playerHp/maxPlayerHp*100)+"%";
 document.getElementById('playerHpText').textContent = `${Math.max(0,playerHp)} / ${maxPlayerHp}`;
}

function log(s){document.getElementById("log").textContent=s}

function clearPendingTimeout(){ if(pendingTimeout){ clearTimeout(pendingTimeout); pendingTimeout=null; } }

function showDamage(text,color,target='center'){
 const el=document.createElement('div');
 let cls='damagePopup';
 if(target==='enemy')cls+=' enemy';
 else if(target==='player')cls+=' player';
 el.className=cls; el.textContent=text;
 if(color) el.style.color=color;
 document.body.appendChild(el);
 // position
 if(target==='enemy'){
   const enemyEl=document.querySelector('.enemy');
   const rect=enemyEl.getBoundingClientRect();
   el.style.left=(rect.left + rect.width/2)+'px';
   el.style.top=(rect.top + rect.height/2 - 8)+'px';
 } else if(target==='player'){
   const hpEl=document.getElementById('playerHp');
   const rect=hpEl.getBoundingClientRect();
   el.style.left=(rect.left + rect.width/2)+'px';
   el.style.top=(rect.top + rect.height/2 + 10)+'px';
 } else {
   el.style.left='50%'; el.style.top='50%';
 }
 // force layout then animate
 requestAnimationFrame(()=>el.classList.add('show'));
 setTimeout(()=>el.remove(),900);
}

function lockInput(){ canMove=false; }
function unlockInput(){ canMove=true; }

function move(dir){
 if(!canMove) return;
 lockInput();
 const before=board.slice();
 let gained=[];
 for(let line=0;line<4;line++){
   let idx=[];
   for(let k=0;k<4;k++){
     let r,c;
     if(dir==="left"){r=line;c=k}
     if(dir==="right"){r=line;c=3-k}
     if(dir==="up"){r=k;c=line}
     if(dir==="down"){r=3-k;c=line}
     idx.push(r*4+c);
   }
   let vals=idx.map(i=>board[i]).filter(v=>v);
   if(dir==="right"||dir==="down") vals=vals.reverse();
   let out=[];
   for(let k=0;k<vals.length;k++){
     if(k+1<vals.length && vals[k]===vals[k+1]){
       const nv=vals[k]*2; out.push(nv); gained.push(nv); k++;
     } else out.push(vals[k]);
   }
   while(out.length<4)out.push(0);
   if(dir==="right"||dir==="down")out.reverse();
   idx.forEach((bi,k)=>board[bi]=out[k]);
 }
 // robust moved detection
 const moved = JSON.stringify(before)!==JSON.stringify(board);
 if(!moved){ unlockInput(); return; }
 addRandom();
 let damage=0;
 gained.forEach(v=>damage+=v);
 if(gained.length>0){
   damage=Math.round(damage*(1+comboBonus*.15))+bonusDamage+baseAttack;
   enemy.hp-=damage;
   score+=damage;
   log(`合体攻撃！ ${damage} ダメージ❤`);
   // visual: show damage over enemy first
   showDamage(`${damage}`, '#ffd966', 'enemy');
   render();
   // if enemy died, show win sequence
   if(enemy.hp<=0){
     enemy.hp=0;
     clearPendingTimeout();
     // showUpgrade synchronously on next frame so UI doesn't lock without overlay
     requestAnimationFrame(()=>{
       winBattle();
     });
     return;
   }
   // otherwise enemy retaliates after a short delay (let damage popup show)
   clearPendingTimeout();
   pendingTimeout = setTimeout(()=>{
     enemyAttack();
     render();
     if(isGameOver()) { gameOver(); return; }
     unlockInput();
     pendingTimeout=null;
   }, 450);
 } else {
   // no combination: immediate move, then enemy attacks after small delay
   render();
   clearPendingTimeout();
   pendingTimeout = setTimeout(()=>{
     enemyAttack();
     render();
     if(isGameOver()) { gameOver(); return; }
     unlockInput();
     pendingTimeout=null;
   }, 200);
 }
}

function enemyAttack(){
 let dmg=Math.max(0,enemy.atk-shield);
 shield=0;
 if(dmg>0){
   // apply damage with small delay to allow shake visual
   playerHp-=dmg;
   log(`敵の攻撃！ ${dmg} ダメージ。`);
   // shake screen
   document.getElementById('wrap').classList.add('shake');
   setTimeout(()=>document.getElementById('wrap').classList.remove('shake'),500);
   showDamage(`-${dmg}`, '#ff6b6b', 'player');
 }
 if(heal){playerHp=Math.min(maxPlayerHp,playerHp+heal)}
}

function winBattle(){
 score+=enemy.maxHp;
 floor++;
 // full heal on floor clear
 playerHp = maxPlayerHp;
 if(heal)playerHp=Math.min(maxPlayerHp,playerHp+heal);
 // keep current enemy visual (hp 0) so player sees defeat
 canMove=false;
 clearPendingTimeout();
 render();
 // Show upgrade overlay immediately (no pending timeout) to avoid timing issues
 showUpgrade();
}

const upgrades=[
 ["強化合体","合体攻撃のダメージ +25","damage"],
 ["鉄壁","次の敵攻撃を5軽減","shield"],
 ["再生","毎ターンHPを2回復","heal"],
 ["連鎖強化","1ターンの合体数に応じて攻撃力UP","combo"],
 ["生命力強化","最大HPを5アップ","maxhp"],
 ["基礎強化","基礎攻撃力を1上げる","base"]
];
function showUpgrade(){
 const box=document.getElementById("choices");box.innerHTML="";
 // ensure overlay is topmost
 const upOverlay = document.getElementById('upgradeOverlay');
 upOverlay.style.zIndex = 999;
 // present picks
 const picks=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);
 picks.forEach(([n,d,id])=>{
   const b=document.createElement("button");b.className="choice";
   b.innerHTML=`<b>${n}</b><small>${d}</small>`;
   b.onclick=()=>{
     // apply upgrade
     if(id==="damage")bonusDamage+=2;
     if(id==="shield")shield+=5;
     if(id==="heal")heal+=2;
     if(id==="combo")comboBonus++;
     if(id==="maxhp"){ maxPlayerHp+=5; playerHp = Math.min(maxPlayerHp, playerHp+5); }
     if(id==="base"){ baseAttack+=1; }
     // hide overlay, spawn next enemy and allow input
     upOverlay.style.display = 'none';
     // spawn next enemy for the new floor
     spawnEnemy();
     render();
     unlockInput();
     log(`${n}を獲得！❤`);
   };
   box.appendChild(b);
 });
 // show overlay and lock input
 upOverlay.style.display="flex";
 canMove=false;
}

function isGameOver(){
 return playerHp<=0 || !canMoves();
}
function canMoves(){
 if(board.some(v=>!v))return true;
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  const i=r*4+c;
  if(c<3&&board[i]===board[i+1])return true;
  if(r<3&&board[i]===board[i+4])return true;
 }
 return false;
}

function gameOver(){
 document.getElementById("finalScore").textContent=`到達フロア: ${floor}　スコア: ${score}`;
 document.getElementById("gameOverOverlay").style.display="flex";
 canMove=false;
}

function resetGame(){
 board=emptyBoard(); addRandom(); addRandom(); maxPlayerHp=30; playerHp=maxPlayerHp; floor=1; score=0; bonusDamage=0; shield=0; heal=0; comboBonus=0; baseAttack=0; canMove=true;
 document.getElementById('gameOverOverlay').style.display='none';
 document.getElementById('upgradeOverlay').style.display='none';
 document.getElementById('startOverlay').style.display='none';
 spawnEnemy(); render(); log('新しくゲームを開始しました！矢印で動かしてね❤');
}

// Initialize everything after DOM is ready
function initGame(){
 // input handlers for direction buttons
 document.querySelectorAll("[data-dir]").forEach(b=>{
   b.addEventListener("click", ()=>move(b.dataset.dir));
 });
 
 // keyboard controls
 document.addEventListener("keydown",e=>{
   const m={ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"};
   if(m[e.key]){e.preventDefault();move(m[e.key])}
 });
 
 // touch controls
 document.addEventListener("touchmove",e=>{ if(touchStart) e.preventDefault(); },{passive:false});
 const boardEl=document.getElementById("board");
 boardEl.addEventListener("touchstart",e=>{touchStart=e.touches[0]},{passive:true});
 boardEl.addEventListener("touchend",e=>{
   if(!touchStart)return;
   const t=e.changedTouches[0],dx=t.clientX-touchStart.clientX,dy=t.clientY-touchStart.clientY;
   touchStart=null;
   if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
   move(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
 },{passive:true});
 
 // Start button handler
 const startButton=document.getElementById("startButton");
 if(startButton){
   startButton.addEventListener("click", ()=>{
     document.getElementById("startOverlay").style.display="none";
     canMove=true;
     log("ゲーム開始！矢印ボタンでタイルを動かしてね❤");
   });
 }
 
 // Initial game setup
 board=emptyBoard();addRandom();addRandom();spawnEnemy();render();
}

// Start everything when DOM is ready
if(document.readyState==='loading'){
 document.addEventListener('DOMContentLoaded', initGame);
} else {
 initGame();
}
</script>
</body>
</html>
