'use strict';const S=4;let board=[],playerHp=20,maxHp=20,floor=1,score=0,enemy=null,baseAttack=5,combo=0,deadline=0,timerId=null,canMove=false,touch=null,previousMax=0,spawnThreshold=0,audioCtx=null,enemyTurn=0,enemyCharge=false;let skills={regen:0,maxHp:0,comboTime:0,baseUp:0,comboUp:0,sacrifice:false,magician:false,ouroboros:false,mushroom:false,devil:false,chaos:false,weakling:false,berserker:false,chainCannon:false,overreaction:false,multiplication:false,dependence:false,embryo:false,blessing:false,backwater:false,emperor:false,grudge:false,hunger:false,mummy:false,accumulation:0,alchemist:0,reversal:0,gluttony:0,reaper:0,gambler:0,bomb:0,colored:false,extraction:false};

['生贄','致死ダメージを受けたとき、盤面の最大値のタイルを1つを生贄にして復活。','sacrifice','card'],['マジシャン','コンボ倍率2倍。受付時間半減。このスキルを持っている間、コンボ延長は出現しない。','magician','card'],['狂戦士','HPが50%以下なら与ダメージ2倍。','berserker','card'],['連鎖砲','同時に3合体で攻撃を追加1回、5合体でさらに追加1回攻撃。','chainCannon','card'],['過剰反応','そのターン生まれた数字に前ターン最大値以上があればダメージ2倍。','overreaction','card'],['増殖','敵撃破時、最小値のタイルを3つランダムな空きマスに生成。','multiplication','card'],['依存','コンボ中、毎ターン基礎攻撃力+1。受付時間-10ms。','dependence','card'],['胚','1ターンの合体数だけコンボ増加。','embryo','card'],['呪福','毎ターン最大HPの1/8を失い、基礎攻撃力+2。','blessing','card'],['背水','残りHP32以下で与ダメージ2倍。','backwater','card'],['帝王','盤面の最大値が基礎攻撃力に加算する。','emperor','card'],['恨み','ダメージを受けるたび基礎攻撃力+2。','grudge','card'],['空腹','盤面のタイル数が少ないほど与ダメージ増加。','hunger','card'],['ミイラ','合成した時にしか新しい数字が出ない。合体出来なくなったときは盤面の最小のタイルが出現する','mummy','card'],['蓄積','攻撃しなかったターン、基礎攻撃力が+1。','accumulation','card'],['ギャンブラー','攻撃ごとに50%を基準に高コンボほど2倍の確率が上昇。','gambler','card'],['色眼鏡','敵から受けるダメージを常に最大HPの二分の一にする（切り上げ）。','colored','card'],['抽出','タイルが出るタイミングの2回に一回しか出なくなるが、出るタイルの値が2倍になる','extraction','card'],

function $(x){return document.getElementById(x)}function level(id){return typeof skills[id]==='number'?skills[id]:(skills[id]?1:0)}function owned(id){return level(id)>0}function empty(){return Array(16).fill(0)}function candidates(){let a=[...new Set(board.filter(Boolean))].filter(x=>x>spawnThreshold);if(skills.chaos&&a.length)return a;if(skills.ouroboros)return a;return [2,2,2,2,2,2,2,2,2,4].filter(x=>x>spawnThreshold)}function addRandom(){let n=skills.chaos?2:1;for(let z=0;z<n;z++){spawnCount++;if(skills.extraction&&spawnCount%2===0)continue;let e=board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(!e.length)continue;let i=e[Math.floor(Math.random()*e.length)],c=candidates();if(!c.length)continue;let v=c[Math.floor(Math.random()*c.length)];if(skills.extraction)v*=2;board[i]=v}}function removeRandom(){let e=board.map((v,i)=>v?i:-1).filter(i=>i>=0);if(e.length)board[e[Math.floor(Math.random()*e.length)]]=0}
function spawnEnemy(){let t=enemies[(floor-1)%enemies.length],hp=Math.round(t.hp*Math.pow(2,floor-1));enemy={name:t.name,hp,maxHp:hp,atk:Math.max(1,Math.round(t.atk*(1+(floor-1)*.15))),type:t.type,desc:t.desc};if(skills.reaper)enemy.atk*=Math.pow(2,level('reaper'));enemyTurn=0;enemyCharge=false}
function render(){let b=$('board');b.innerHTML='';board.forEach((v,i)=>{let d=document.createElement('div');d.className='tile '+(v?'t'+v:'')+(i===mageTarget?' mageTarget':'');d.textContent=v||'';b.appendChild(d)});$('floor').textContent=floor;$('atk').textContent=Math.floor(baseAttack);$('score').textContent=score;$('enemyName').textContent=enemy.name;$('enemyText').textContent=`${Math.max(0,enemy.hp)} / ${enemy.maxHp}`;$('enemyHp').style.width=Math.max(0,enemy.hp/enemy.maxHp*100)+'%';$('playerHp').textContent=`${Math.max(0,playerHp)} / ${maxHp}`;$('playerHpFill').style.width=Math.max(0,playerHp/maxHp*100)+'%';$('combo').textContent=combo;$('mult').textContent='×'+mult().toFixed(2);$('placeBtn').style.display=board.every(v=>v===0)&&canMove?'block':'none';renderSkills();refreshTimer()}
function renderSkills(){let box=$('skillList');box.innerHTML='';let arr=defs.filter(x=>owned(x[2]));if(!arr.length){box.innerHTML='<span style="color:#777;font-size:11px">なし</span>';return}arr.forEach(x=>{let d=document.createElement('span');d.className='badge '+(x[3]==='level'?'blue':x[3]==='repeat'?'green':'gold');d.textContent=x[0]+(x[3]!=='card'?` Lv${level(x[2])}`:'');box.appendChild(d)})}
function timeLimit(){let t=1900+skills.comboTime*150-Math.max(0,combo-1)*240-skills.dependence*10-skills.gambler*30;if(skills.magician)t*=.5;return Math.max(0.01,t)}function mult(){let m=1+Math.max(0,combo-1)*(.08+skills.comboUp*.05);if(skills.magician)m*=2;return m}function refreshTimer(){let r=combo&&deadline?Math.max(0,deadline-Date.now()):0;$('timer').textContent=combo&&deadline?(r/1000).toFixed(1)+'s':'-';$('comboFill').style.width=combo?Math.max(0,r/timeLimit()*100)+'%':'0%'}function startTimer(){clearInterval(timerId);if(!combo)return;timerId=setInterval(()=>{if(!canMove||paused){refreshTimer();return}if(Date.now()>=deadline){combo=Math.max(0,combo-1);deadline=combo?Date.now()+timeLimit():0;if(!combo){clearInterval(timerId);timerId=null} }refreshTimer()},50)}
function slide(a,rev){let x=rev?[...a].reverse():[...a],c=x.filter(Boolean),r=[],g=[];for(let i=0;i<c.length;i++){if(i+1<c.length&&c[i]===c[i+1]){r.push(c[i]*2);g.push(c[i]*2);i++}else r.push(c[i])}while(r.length<4)r.push(0);return {v:rev?r.reverse():r,g}}
function ensureAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}function tone(freq,dur=.08,type='sine',gain=.035){if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}function playComboSound(c){ensureAudio();if(!audioCtx)return;let n=Math.min(7,c);tone(260+n*70,.09,'triangle',.045);setTimeout(()=>tone(420+n*90,.11,'sine',.035),55);if(c>=5)setTimeout(()=>tone(900+n*60,.14,'square',.025),110)}function playHitSound(){ensureAudio();tone(150,.08,'sawtooth',.04);setTimeout(()=>tone(90,.12,'square',.025),35)}function playPlayerHitSound(){ensureAudio();tone(100,.12,'sawtooth',.045);setTimeout(()=>tone(65,.15,'square',.03),50)}function comboVisual(c){let p=document.querySelector('.comboPanel');p.classList.remove('comboPulse','comboMax');void p.offsetWidth;p.classList.add(c>=7?'comboMax':'comboPulse');if(c>=3)shake()}function bubble(n,type='enemy'){let p=type==='player'?document.querySelector('.playerPanel'):$('damageStage'),d=document.createElement('div');d.className='dmg '+(type==='player'?'pdmg':'');d.textContent='-'+n;p.appendChild(d);setTimeout(()=>d.remove(),600)}function shake(){document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),240)}
function move(dir){if(!canMove||paused)return;ensureAudio();let before=board.slice(),g=[];for(let l=0;l<4;l++){let idx=[];for(let k=0;k<4;k++)idx.push((dir==='left'||dir==='right')?l*4+k:k*4+l);let r=slide(idx.map(i=>board[i]),dir==='right'||dir==='down');idx.forEach((i,k)=>board[i]=r.v[k]);g.push(...r.g)}if(board.every((v,i)=>v===before[i]))return;previousMax=Math.max(...before);if(skills.chaos)removeRandom();if(g.length){combo+=skills.embryo?g.length:1;deadline=Date.now()+timeLimit();startTimer();playComboSound(combo);comboVisual(combo);if(skills.dependence && combo>=2)baseAttack+=1;let sum=board.reduce((a,v)=>a+v,0),h=skills.hunger?1+(16-board.filter(Boolean).length)*.05:1,damage=Math.floor(baseAttack*sum*mult()*h);if(enemy.type==='golem'&&combo<4)damage=Math.floor(damage*.5);if(skills.overreaction&&g.some(v=>v>=previousMax))damage*=2;if(skills.berserker&&playerHp<=maxHp/2)damage*=2;if(skills.backwater&&playerHp<=32)damage*=2;if(skills.gambler){let p=Math.min(.95,.5+Math.max(0,combo-1)*.05);damage*=Math.random()<p?2:.5}damage=Math.max(0,Math.round(damage));let attacks=g.length+(skills.chainCannon&&g.length>=3?1:0)+(skills.chainCannon&&g.length>=5?1:0);for(let i=0;i<attacks;i++){enemy.hp-=damage;score+=damage;if(enemy.hp<=0)break}bubble(damage);playHitSound();$('log').textContent=`合体攻撃！ ${damage}ダメージ ×${attacks}回 / ${combo}コンボ`;if(enemy.hp<=0){win();return}}else{if(skills.accumulation)baseAttack+=skills.accumulation;$('log').textContent='スライド！'}if(!skills.mummy)addRandom();else if(g.length===0){let vals=board.filter(Boolean);if(vals.length){let empty=board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(empty.length){board[empty[Math.floor(Math.random()*empty.length)]]=Math.min(...vals)}}}if(enemy.hp<=0){win();return}enemyAttack();if(skills.blessing){let loss=Math.max(1,Math.floor(maxHp/8));maxHp=Math.max(1,maxHp-loss);playerHp=Math.min(playerHp,maxHp);baseAttack+=2}if(isDead())gameOver();render()}
function enemyAttack(){enemyTurn++;let action='';if(enemy.type==='slime'&&enemyTurn%3===0){let heal=Math.max(1,Math.floor(enemy.maxHp*.25));enemy.hp=Math.min(enemy.maxHp,enemy.hp+heal);let e=board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(e.length){board[e[Math.floor(Math.random()*e.length)]]=Math.min(...board.filter(Boolean));action=`スライムが分裂！HP+${heal}`}}if(enemy.type==='ogre'&&enemyTurn%3===0){enemyCharge=true;action='オーガが力を溜めている！'}let d=enemy.atk;if(enemy.type==='ogre'&&enemyCharge&&enemyTurn%3!==0){d*=2;enemyCharge=false;action='オーガの強烈な一撃！'}if(enemy.type==='mage'&&enemyTurn%2===0){let ids=board.map((v,i)=>v?i:-1).filter(i=>i>=0);let vals=board.filter(Boolean);if(ids.length&&vals.length>1){let i=ids[Math.floor(Math.random()*ids.length)],old=board[i],opts=vals.filter(v=>v!==old),v=opts.length?opts[Math.floor(Math.random()*opts.length)]:old;mageTarget=i;render();setTimeout(()=>{board[i]=v;mageTarget=-1;render()},220);action='魔術師が盤面を変化させた！'}}if(enemy.type==='hunter'&&enemyTurn%3===0){let vals=board.filter(Boolean);if(vals.length){let mx=Math.max(...vals),i=board.indexOf(mx);board[i]=0;action=`ハンターが最大値 ${mx} を狙い撃ち！`}}if(skills.colored)d=Math.ceil(maxHp/2);playerHp=Math.max(0,playerHp-d);if(d){bubble(d,'player');playPlayerHitSound();shake();if(skills.grudge)baseAttack+=2;$('log').textContent=(action?action+' ':'')+`敵の攻撃！ ${d}ダメージ`};if(playerHp<=0&&skills.sacrifice){let v=board.filter(Boolean);if(v.length>=2){let m=Math.max(...v),i=board.indexOf(m);board[i]=0;playerHp=Math.min(maxHp,m);$('log').textContent=`生贄！ ${m}を犠牲に復活！`}}if(playerHp<=0)return;if(skills.regen){let h=2*Math.pow(2,skills.regen-1);playerHp=Math.min(maxHp,playerHp+h)}if(action&&!d)$('log').textContent=action}
function win(){if(skills.multiplication){let v=board.filter(Boolean),e=board.map((x,i)=>x? -1:i).filter(i=>i>=0);if(v.length&&e.length){let m=Math.min(...v),n=Math.min(3,e.length);for(let z=0;z<n;z++){let k=Math.floor(Math.random()*e.length),i=e.splice(k,1)[0];board[i]=m}}}score+=enemy.maxHp;floor++;playerHp=maxHp;skills.chaos=false;spawnEnemy();canMove=false;freezeStarted=Date.now();render();setTimeout(()=>{if(!paused){if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;freezeStarted=0;showUpgrade()}},500)}
function isDead(){return playerHp<=0||(!board.every(v=>v===0)&&!canMoves())}function canMoves(){if(board.some(v=>!v))return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){let i=r*4+c;if(c<3&&board[i]===board[i+1]||r<3&&board[i]===board[i+4])return true}return false}function gameOver(){$('final').textContent=`到達フロア: ${floor}　スコア: ${score}`;$('gameover').style.display='flex';canMove=false;clearInterval(timerId)}
function apply(id){let s=defs.find(x=>x[2]===id);if(!s)return;skills[id]=typeof skills[id]==='number'?skills[id]+1:true;if(id==='emperor'){let v=board.filter(Boolean),mx=v.length?Math.max(...v):0;baseAttack+=mx;emperorBonus+=mx}if(id==='maxHp'){maxHp*=2;playerHp+=maxHp/2}if(id==='weakling'){let gain=Math.floor(playerHp/4);baseAttack+=gain;maxHp=Math.max(1,Math.floor(maxHp/8));playerHp=Math.min(playerHp,maxHp)}if(id==='ouroboros'){let v=board.filter(Boolean);if(v.length){let mn=Math.min(...v),mx=Math.max(...v);spawnThreshold=Math.max(spawnThreshold,mn);board=board.map(x=>(x===mn||x===mx)?0:x)}}if(id==='mushroom'){let v=board.filter(Boolean),mn=Math.min(...v);board=board.map(x=>x===mn?x*2:x)}if(id==='devil'){let v=board.filter(Boolean),mx=Math.max(...v);board=board.map(x=>x===mx?x*2:x);let a=defs.filter(x=>x[3]==='level'&&x[2]!==id&&owned(x[2]));if(a.length){let t=a[Math.floor(Math.random()*a.length)];skills[t[2]]=typeof skills[t[2]]==='number'?0:false}}if(id==='multiplication'){/* 敵撃破時に発動 */}if(id==='alchemist'){let v=board.filter(Boolean),mn=Math.min(...v),sum=0;board=board.map(x=>x===mn?(sum+=x,0):x);baseAttack+=sum}if(id==='reversal'){let v=board.filter(Boolean),mn=Math.min(...v),mx=Math.max(...v);board=board.map(x=>x===mn?mx:x===mx?mn:x)}if(id==='gluttony'){let mx=Math.max(...board),i=board.indexOf(mx);board[i]=0;baseAttack+=mx}if(id==='reaper'){enemy.hp=Math.max(1,Math.floor(enemy.hp/2));enemy.atk*=2}if(id==='bomb'){let v=board.filter(Boolean);if(v.length&&new Set(v).size>1){let mx=Math.max(...v),sum=0,kept=false;board=board.map(x=>{if(x===mx&&!kept){kept=true;return x}if(x){sum+=x}return 0});baseAttack+=sum}}if(id==='baseUp')baseAttack+=5;if(id==='blessing'){let loss=Math.max(1,Math.floor(maxHp/8));maxHp=Math.max(1,maxHp-loss);playerHp=Math.min(playerHp,maxHp);baseAttack+=2}}
function available(){return defs.filter(x=>{if(floor%2===1&&x[3]==='level')return false;if(floor%2===0&&x[3]!=='level')return false;if(x[2]==='comboTime'&&skills.magician)return false;if(x[3]==='card'&&owned(x[2]))return false;return true})}
function showUpgrade(){paused=false;$('pauseBtn').textContent='⏸ 一時停止';$('floorRule').textContent=floor%2===1?'奇数フロア：カード＋何回でも取得可能':'偶数フロア：レベルアップスキルのみ';let box=$('choices');box.innerHTML='';available().sort(()=>Math.random()-.5).slice(0,3).forEach(s=>{let b=document.createElement('button');b.className='choice '+(s[3]==='level'?'blueChoice':s[3]==='repeat'?'greenChoice':'goldChoice');b.innerHTML=`<b>${s[0]}${s[3]!=='card'?` Lv${level(s[2])+1}`:''}</b><small>${s[1]}</small>`;b.onclick=()=>choose(s);box.appendChild(b)});if(floor%2===1){let skip=document.createElement('button');skip.className='primary';skip.textContent='いらない';skip.onclick=skipSkill;box.appendChild(skip)}$('upgrade').style.display='flex'}
function choose(s){if(s[3]==='card'&&defs.filter(x=>x[3]==='card'&&owned(x[2])).length>=3){let box=$('discardChoices');box.innerHTML='';defs.filter(x=>x[3]==='card'&&owned(x[2])).forEach(d=>{let b=document.createElement('button');b.className='choice goldChoice';b.innerHTML=`<b>${d[0]}</b><small>${d[1]}</small>`;b.onclick=()=>{if(d[2]==='emperor')baseAttack-=emperorBonus,emperorBonus=0;skills[d[2]]=false;$('discard').style.display='none';finishChoose(s)};box.appendChild(b)});$('discard').style.display='flex';return}finishChoose(s)}function finishChoose(s){apply(s[2]);if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;freezeStarted=0;$('upgrade').style.display='none';canMove=true;render();$('log').textContent=`${s[0]}を獲得！`}function skipSkill(){if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;freezeStarted=0;$('upgrade').style.display='none';canMove=true;render();$('log').textContent='今回はスキルを取得しなかった！'}$('discardBack').onclick=()=>{$('discard').style.display='none';$('upgrade').style.display='flex'}
function placeNumber(){if(!canMove||!board.every(v=>v===0))return;ensureAudio();let c=candidates();board[Math.floor(Math.random()*16)]=c[Math.floor(Math.random()*c.length)];combo=Math.max(0,combo-1);deadline=combo?Date.now()+timeLimit():0;playComboSound(1);$('log').textContent='盤面が空になったため、数字を1つ置いた！';render()}
function togglePause(){if(!canMove)return;paused=!paused;if(paused){freezeStarted=Date.now();$('pauseBtn').textContent='▶ 再開';$('log').textContent='一時停止中';}else{if(freezeStarted&&deadline)deadline+=Date.now()-freezeStarted;freezeStarted=0;$('pauseBtn').textContent='⏸ 一時停止';$('log').textContent='ゲーム再開！';}render()}function start(){ensureAudio();canMove=true;$('start').style.display='none';$('log').textContent='ゲーム開始！';render()}document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.addEventListener('keydown',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right'};if(m[e.key]){e.preventDefault();move(m[e.key])}});$('board').addEventListener('touchstart',e=>{let t=e.touches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});$('board').addEventListener('touchend',e=>{if(!touch)return;let t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});$('startBtn').onclick=start;$('placeBtn').onclick=placeNumber;$('restart').onclick=()=>location.reload();$('pauseBtn').onclick=togglePause;board=empty();addRandom();addRandom();spawnEnemy();render();$('start').style.display='flex';setInterval(refreshTimer,100);
</script></body></html>
